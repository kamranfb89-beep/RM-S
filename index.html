<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RMİS</title>
<meta name="description" content="RMİS — Rəqəmsal məktəb idarəetmə sistemi. Kamil Əyyubov adına 12 nömrəli tam orta ümumtəhsil məktəbi">
<meta name="theme-color" content="#1e3a8a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RMİS">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #ffffff; font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  #app { position: fixed; top: 0; left: 0; right: 0; bottom: env(safe-area-inset-bottom, 0px); width: 100%; height: calc(100% - env(safe-area-inset-bottom, 0px)); border: 0; background: #fff; }
  #splash { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    background: linear-gradient(180deg, #1e3a8a 0%, #172554 100%); color: #fff; text-align: center; padding: 24px; box-sizing: border-box; transition: opacity .35s ease; }
  #splash.hide { opacity: 0; pointer-events: none; }
  .logo { width: 116px; height: 116px; border-radius: 28px; background: #fff; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,.28); margin-bottom: 8px; }
  .logo img { display: block; width: 100%; height: 100%; border-radius: 28px; }
  .t1 { font-size: 22px; font-weight: 700; letter-spacing: .2px; }
  .t2 { font-size: 13.5px; opacity: .85; max-width: 300px; line-height: 1.4; padding: 0 8px; }
  .spin { width: 30px; height: 30px; margin-top: 22px; border-radius: 50%; border: 3px solid rgba(255,255,255,.28); border-top-color: #fff; animation: sp .9s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }
  .t3 { font-size: 13px; opacity: .8; min-height: 18px; max-width: 300px; line-height: 1.4; padding: 0 8px; }
  .acts { display: none; flex-direction: column; gap: 10px; margin-top: 18px; width: 100%; max-width: 280px; }
  .acts.on { display: flex; }
  .btn { appearance: none; border: 0; border-radius: 12px; padding: 13px 16px; font-size: 15px; font-weight: 600; cursor: pointer; background: #fff; color: #1e3a8a; }
  .btn.ghost { background: rgba(255,255,255,.14); color: #fff; }
  .off .spin { display: none; }
</style>
</head>
<body>
<iframe id="app" title="RMİS" allow="clipboard-write; fullscreen" referrerpolicy="strict-origin-when-cross-origin"></iframe>
<div id="splash" role="status">
  <div class="logo"><img src="icon-192.png" alt="Məktəbin gerbi"></div>
  <div class="t2">Kamil Əyyubov adına 12 nömrəli tam orta ümumtəhsil məktəbi</div>
  <div class="spin"></div>
  <div class="t3" id="msg">Yüklənir…</div>
  <div class="acts" id="acts">
    <button class="btn" id="retry" type="button">Yenidən cəhd et</button>
    <button class="btn ghost" id="browser" type="button">Brauzerdə aç</button>
  </div>
</div>
<script>
  /* Sistemin ünvanı (idarəetmə sisteminin veb tətbiqi). Ünvan dəyişərsə, yalnız bu sətri dəyişin. */
  var APP_URL = 'https://script.google.com/macros/s/AKfycbw1WrdbElzZC8fe66_V4EpZOn8k-Z1BJ-Cv19kB7p1WfIiOw9Sorh_-qPbu5WeNFGYwhw/exec';
  /* Yalnız Google-un tətbiq səhifəsindən gələn xəbərlər qəbul olunur (heç bir parol və ya açar ötürülmür). */
  var APP_ORIGIN = /^https:\/\/[a-z0-9-]+\.googleusercontent\.com$/;

  var frame = document.getElementById('app'), splash = document.getElementById('splash'), msg = document.getElementById('msg'), acts = document.getElementById('acts');
  var ready = false, slowTimer = null, hardTimer = null;
  function setMsg(t) { msg.textContent = t; }
  function showActs(on) { acts.className = on ? 'acts on' : 'acts'; }
  function hideSplash() { ready = true; clearTimeout(slowTimer); clearTimeout(hardTimer); splash.className = 'hide'; setTimeout(function () { splash.style.display = 'none'; }, 400); }
  function showSplash() { splash.style.display = ''; splash.className = ''; }
  function offline() {
    showSplash(); splash.className = 'off'; showActs(true);
    setMsg('İnternet bağlantısı yoxdur. Bağlantı bərpa olunanda tətbiq özü açılacaq.');
  }
  function load() {
    ready = false; showSplash(); showActs(false); setMsg('Yüklənir…');
    if (navigator.onLine === false) { offline(); return; }
    frame.src = APP_URL + (APP_URL.indexOf('?') >= 0 ? '&' : '?') + 'app=1';
    clearTimeout(slowTimer); clearTimeout(hardTimer);
    slowTimer = setTimeout(function () { if (!ready) { setMsg('Bağlantı zəifdir, gözləyin…'); showActs(true); } }, 20000);
    // nə isə səbəbdən "hazırdır" xəbəri gəlməsə belə, 45 saniyədən sonra səhifə göstərilir
    hardTimer = setTimeout(function () { if (!ready) hideSplash(); }, 45000);
  }
  window.addEventListener('message', function (e) {
    if (!APP_ORIGIN.test(String(e.origin || ''))) return;
    var d = e.data; if (!d || typeof d !== 'object') return;
    if (d.mk12 === 'hello') { try { e.source.postMessage({ mk12: 'shell', v: 1 }, e.origin); } catch (x) {} }
    else if (d.mk12 === 'ready') hideSplash();
  });
  document.getElementById('retry').onclick = load;
  document.getElementById('browser').onclick = function () { window.open(APP_URL, '_blank'); };
  window.addEventListener('offline', function () { if (!ready) offline(); });
  window.addEventListener('online', function () { if (!ready) load(); });
  if ('serviceWorker' in navigator) { window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); }); }
  load();
</script>
</body>
</html>
